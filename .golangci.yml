version: "2"
linters:
  default: standard
  enable:
    - misspell
    - unconvert
  settings:
    errcheck:
      # Best-effort cleanup and terminal output; failures here are not actionable.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - os.Remove
        - fmt.Fprintf
        - fmt.Fprintln
        - (*text/tabwriter.Writer).Flush
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck]
